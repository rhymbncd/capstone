; Production OPcache — every deploy builds a fresh container from a fresh
; image, so there's no scenario where a cached, compiled file could go
; stale against a changed source file underneath it. Safe to skip the
; filesystem stat() Laravel would otherwise pay on every single include.
opcache.enable=1
opcache.validate_timestamps=0

opcache.memory_consumption=192
opcache.max_accelerated_files=20000
opcache.interned_strings_buffer=16

; One-shot artisan commands in entrypoint.sh don't benefit from a CLI
; opcache (each process exits immediately after) — keep it web-only.
opcache.enable_cli=0
